name: TOConline fiscal validation
on:
  push:
    branches: [main, feature/toconline-receipt-rehearsal-20261017, feature/toconline-readonly-oauth-20261017]
    paths:
      - 'server/payments/**'
      - 'server/test/**'
      - 'src/data/circ2027FiscalPolicy.json'
      - 'server/worker.mjs'
      - 'wrangler.jsonc'
      - 'src/pages/ToconlineReceiptTestPage.js'
      - 'src/pages/ToconlineReceiptTestPage.test.js'
      - 'src/components/LivePaymentSetupDiagnostics*'
      - 'src/components/LivePaymentPilotPreview*'
      - 'src/App.js'
      - 'src/components/AdminModuleNav.js'
      - '.github/workflows/toconline-rehearsal-validation.yml'
  pull_request:
    paths:
      - 'server/payments/**'
      - 'server/test/**'
      - 'src/data/circ2027FiscalPolicy.json'
      - 'server/worker.mjs'
      - 'wrangler.jsonc'
      - 'src/pages/ToconlineReceiptTestPage*'
      - 'src/components/LivePaymentSetupDiagnostics*'
      - 'src/components/LivePaymentPilotPreview*'
      - '.github/workflows/toconline-rehearsal-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toconline-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TOConline server tests
        run: node --test server/test/*.test.mjs
      - name: Receipt rehearsal UI tests
        run: CI=true npm test -- --watchAll=false --runInBand src/pages/ToconlineReceiptTestPage.test.js src/components/LivePaymentSetupDiagnostics.test.js src/components/LivePaymentPilotPreview.test.js
      - name: Production bundle
        run: CI=true npm run build
