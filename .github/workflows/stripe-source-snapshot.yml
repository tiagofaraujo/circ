name: Stripe source snapshot
on:
  push:
    branches: [feature/stripe-checkout-sandbox-20261013]
    paths: ['.github/workflows/stripe-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/circ-stripe-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: stripe-source
          path: ${{ runner.temp }}/circ-stripe-source.tar.gz
          retention-days: 1
