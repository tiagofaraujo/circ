name: Bank transfer practical validation
on:
  push:
    branches: [feature/bank-transfer-practical-20261010]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bank-transfer-practical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test server/test/*.test.mjs
      - run: CI=true npm test -- --watchAll=false --runInBand
      - run: CI=true npm run build
