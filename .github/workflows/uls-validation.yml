name: ULS validation checks

on:
  pull_request:
  push:
    branches:
      - feature/uls-name-match-spark

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install application dependencies
        run: npm ci
      - name: Test application
        run: CI=true npm test -- --watchAll=false --silent
      - name: Test protected accommodation API
        run: node --test server/test/*.test.mjs
      - name: Build application
        run: npm run build
      - name: Check public accommodation assets
        run: node scripts/check-hotel-client-build.cjs

      - name: Test student deployment checker
        run: python3 -m unittest discover -s scripts/tests -v && bash -n scripts/activate-students.sh

      - name: Test private roster importer
        working-directory: functions
        run: npm install --no-audit --no-fund && npm test

      - name: Test Firestore security rules
        working-directory: rules-tests
        run: npm install --no-audit --no-fund && npm test
