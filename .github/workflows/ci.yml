name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        env:
          CI: false
        run: npm run build

      - name: Verify PWA artifacts
        run: |
          test -f build/manifest.json
          test -f build/service-worker.js
          node -e "const m=require('./build/manifest.json'); if(m.display!=='standalone'||m.start_url!=='/'||!Array.isArray(m.icons)||m.icons.length<2){process.exit(1)}"
