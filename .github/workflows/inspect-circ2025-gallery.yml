name: Publish CIRC 2025 gallery
on:
  push:
    paths:
      - '.github/workflows/inspect-circ2025-gallery.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract curated CIRC 2025 photographs
        run: |
          set -euo pipefail
          rm -rf public/gallery/2025
          mkdir -p public/gallery/2025
          tmp="$(mktemp -d)"
          unzip -q media-published/CIRC_Fotografias_JPG_1600px.zip -d "$tmp"
          find "$tmp/jpg_web_1600px" -maxdepth 1 -type f -iname '*_web.jpg' -print0 | sort -z | xargs -0 -I{} cp "{}" public/gallery/2025/
          test "$(find public/gallery/2025 -type f -name '*.jpg' | wc -l)" -eq 11
      - name: Commit gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/gallery/2025
          git diff --cached --quiet && exit 0
          git commit -m "Publish curated CIRC 2025 gallery photographs"
          git push
