name: Sandbox checkout validation
on:
  push:
    branches: [main, feature/sandbox-registration-checkout-20261009]
    paths: ['server/**', 'src/**', 'scripts/**', 'package*.json', 'wrangler.jsonc', '.github/workflows/sandbox-checkout-validation.yml']
  pull_request:
    paths: ['server/**', 'src/**', 'scripts/**', 'package*.json', 'wrangler.jsonc', '.github/workflows/sandbox-checkout-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-checkout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Server regression tests (mock providers only)
        run: node --test server/test/*.test.mjs
      - name: Frontend regression tests
        run: CI=true npm test -- --watchAll=false --runInBand
      - name: Production bundle (no deployment or payment credentials)
        run: CI=true npm run build
